<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Tarefas de Casa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --surface:#1c1c1e; --surface2:#242426; --surface3:#2c2c2e;
    --primary:#7C4DFF; --secondary:#4FD1C5; --danger:#ff6b6b;
    --text:#f2f2f4; --text-dim:#a8a8ad; --border:#3a3a3c;
  }
  body.light{
    --bg:#f5f5f7; --surface:#ffffff; --surface2:#eef0f2; --surface3:#e3e5e8;
    --primary:#6A3DE8; --secondary:#009688; --danger:#e5484d;
    --text:#1c1c1e; --text-dim:#6b6b70; --border:#dcdce0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
    padding-bottom:32px;min-height:100vh;transition:background .2s,color .2s;}
  header{padding:24px 20px 12px;position:sticky;top:0;background:var(--bg);z-index:5;
    border-bottom:1px solid var(--border);}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0;
    display:flex;align-items:center;gap:8px;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);
    box-shadow:0 0 6px var(--danger);transition:.3s;flex-shrink:0;}
  .status-dot.on{background:var(--secondary);box-shadow:0 0 6px var(--secondary);}
  .notif-btn{background:none;border:none;font-size:17px;margin-left:auto;padding:2px 4px;}
  .subtitle{font-family:'Caveat',cursive;font-size:19px;color:var(--secondary);margin:2px 0 12px;}
  .userbar{display:flex;gap:8px;margin-bottom:10px;}
  .userbtn{flex:1;padding:10px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);font-weight:600;font-size:14px;}
  .userbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .score-label{font-size:12px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
  .progress-wrap{background:var(--surface2);border-radius:10px;height:8px;overflow:hidden;margin-bottom:4px;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));
    width:0%;transition:width .4s;}
  .progress-label{font-size:12px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-bottom:10px;}
  #filtroChips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
    color:var(--text-dim);font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .chip.active{background:var(--chip-cor,var(--primary));color:#fff;border-color:transparent;}
  main{padding:16px 20px;max-width:900px;margin:0 auto;}
  .addbar{display:flex;gap:8px;margin-bottom:8px;}
  .addbar input{flex:1;padding:14px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:15px;}
  .addbar input:focus{outline:none;border-color:var(--primary);}
  .addbar button{padding:0 20px;border:none;border-radius:14px;background:var(--primary);
    color:#fff;font-weight:600;font-size:20px;}
  .newtask-row2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .newtask-row2 select{flex:1;min-width:110px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px;}
  .addtag-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;}
  .hist-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600;margin-bottom:14px;}
  #taskList{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;}
  .task{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:10px;transition:.2s;}
  .task.done{opacity:.55;}
  .task-top{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;}
  .check{width:22px;height:22px;border-radius:7px;border:2px solid var(--primary);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .check.checked{background:var(--primary);}
  .check svg{display:none;width:13px;height:13px;stroke:white;}
  .check.checked svg{display:block;}
  .task-text{flex:1;min-width:80px;font-size:14px;font-weight:500;line-height:1.3;}
  .task.done .task-text{text-decoration:line-through;color:var(--text-dim);}
  .task-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--secondary);margin-top:4px;}
  .cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;}
  .badges{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim);margin-top:4px;flex-wrap:wrap;}
  .icon-btn{background:none;border:none;color:var(--text-dim);font-size:13px;padding:1px 3px;}
  .reorder{display:flex;gap:2px;}
  .reorder button{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);
    border-radius:5px;font-size:9px;padding:1px 4px;}
  .task-row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .task-row2 select{background:var(--surface2);color:var(--text);border:1px solid var(--border);
    border-radius:7px;font-size:10px;padding:3px 4px;flex:1;min-width:70px;}
  .comment-box{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
  .comment-box textarea{width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:9px;color:var(--text);font-size:12px;padding:6px 8px;resize:none;min-height:30px;}
  .comment-box textarea::placeholder{color:var(--text-dim);}
  .empty{grid-column:1/-1;text-align:center;color:var(--text-dim);padding:40px 20px;
    font-family:'Caveat',cursive;font-size:22px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:20;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--surface3);border-radius:18px;padding:22px;max-width:320px;width:100%;}
  .modal p{font-size:15px;margin:0 0 12px;}
  #modalInput{display:none;width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:10px;color:var(--text);padding:10px;font-size:14px;margin-bottom:14px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .modal-actions button{padding:10px 16px;border-radius:12px;border:none;font-weight:600;font-size:14px;}
  .btn-cancel{background:var(--surface2);color:var(--text);}
  .btn-confirm{background:var(--danger);color:white;}
  .btn-save{background:var(--primary);color:white;}
  #historicoBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;justify-content:center;z-index:20;}
  #historicoBg.show{display:flex;}
  .hist-panel{background:var(--surface3);width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:20px;max-height:70vh;overflow-y:auto;}
  .hist-panel h3{margin:0 0 12px;font-family:'Space Grotesk';display:flex;justify-content:space-between;}
  .close-hist{background:none;border:none;color:var(--text-dim);font-size:18px;}
  .hist-item{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .hist-item .hist-txt{flex:1;}
  .hist-user{color:var(--secondary);font-weight:600;}
  .hist-time{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;}
</style>
</head><body>
<header>
  <h1><span class="status-dot" id="statusDot"></span> Tarefas de Casa
    <button class="notif-btn" id="btnNotif" onclick="requestNotifPermission()">🔕</button>
    <button class="notif-btn" id="btnTema" onclick="toggleTheme()">🌙</button>
  </h1>
  <div class="subtitle">porque casa arrumada é casa feliz ✨</div>
  <div class="userbar">
    <button class="userbtn" id="btnLeandro" onclick="setUser('Leandro')">Leandro</button>
    <button class="userbtn" id="btnEsposa" onclick="setUser('Esposa')">Esposa</button>
  </div>
  <div class="score-label" id="scoreLabel">🏆 7 dias: Leandro 0 · Esposa 0</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-label" id="progressLabel">0 de 0 feitas</div>
  <div id="filtroChips"></div>
</header>

<main>
  <div class="addbar">
    <input type="text" id="newTaskInput" placeholder="Nova tarefa..." maxlength="120">
    <button onclick="addTask()">+</button>
  </div>
  <div class="newtask-row2">
    <select id="newTaskCategoria"></select>
    <button type="button" class="addtag-btn" onclick="askNovaTag()">+ tag</button>
    <select id="newTaskRecorrencia">
      <option value="nenhuma">Não repete</option>
      <option value="diaria">Repete diariamente</option>
      <option value="semanal">Repete semanalmente</option>
    </select>
  </div>
  <button class="hist-btn" onclick="openHistorico()">📜 Ver histórico</button>
  <div id="taskList"></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <p id="modalText"></p>
    <input type="text" id="modalInput" maxlength="60">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="resetModal()">Cancelar</button>
      <button class="btn-confirm" id="modalConfirmBtn">Excluir</button>
    </div>
  </div>
</div>

<div id="historicoBg">
  <div class="hist-panel">
    <h3>Histórico <button class="close-hist" onclick="closeHistorico()">✕</button></h3>
    <div id="historicoList"></div>
  </div>
</div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCIvy650npDNHF3hAw_b0oagM7gGR4S0R4",
    authDomain: "tarefas-casa-d649c.firebaseapp.com",
    databaseURL: "https://tarefas-casa-d649c-default-rtdb.firebaseio.com",
    projectId: "tarefas-casa-d649c",
    storageBucket: "tarefas-casa-d649c.firebasestorage.app",
    messagingSenderId: "444167249504",
    appId: "1:444167249504:web:ace1f54580aeb31f57ed05"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const tarefasRef = db.ref('tarefas');
  const historicoRef = db.ref('historico');
  const categoriasRef = db.ref('categorias');

  const DEFAULT_CATEGORIAS = {
    cozinha:{label:'Cozinha', cor:'#FFB74D'}, banheiro:{label:'Banheiro', cor:'#4FC3F7'},
    quintal:{label:'Quintal', cor:'#81C784'}, quarto:{label:'Quarto/Sala', cor:'#F06292'},
    outro:{label:'Outro', cor:'#B0BEC5'}
  };
  const PALETA = ['#FFB74D','#4FC3F7','#81C784','#F06292','#B0BEC5','#BA68C8','#FF8A65','#4DD0E1','#AED581','#FFD54F'];
  const ACOES_TEXTO = {concluiu:'concluiu', reabriu:'reabriu', comentou:'comentou em',
    criou:'criou a tarefa', excluiu:'excluiu', editou:'editou'};

  let CATEGORIAS = DEFAULT_CATEGORIAS;
  let tarefas = {};
  let historicoCache = [];
  let historicoIds = new Set();
  let firstHistoricoLoad = true;
  let categoriaFiltro = 'todas';
  let usuarioAtual = localStorage.getItem('usuarioAtual') || null;

  function setUser(nome){
    usuarioAtual = nome;
    localStorage.setItem('usuarioAtual', nome);
    updateUserBar();
  }
  function updateUserBar(){
    document.getElementById('btnLeandro').classList.toggle('active', usuarioAtual==='Leandro');
    document.getElementById('btnEsposa').classList.toggle('active', usuarioAtual==='Esposa');
  }
  updateUserBar();

  function toggleTheme(){
    document.body.classList.toggle('light');
    localStorage.setItem('tema', document.body.classList.contains('light') ? 'light' : 'dark');
    updateThemeBtn();
  }
  function updateThemeBtn(){
    document.getElementById('btnTema').textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
  }
  if(localStorage.getItem('tema')==='light') document.body.classList.add('light');
  updateThemeBtn();

  function requestNotifPermission(){
    if(!window.Notification){ showAlert('Seu navegador não suporta notificações.'); return; }
    Notification.requestPermission().then(updateNotifBtn);
  }
  function updateNotifBtn(){
    const btn = document.getElementById('btnNotif');
    const granted = window.Notification && Notification.permission === 'granted';
    btn.textContent = granted ? '🔔' : '🔕';
  }
  updateNotifBtn();

  function notify(h){
    const msg = `${h.usuario} ${ACOES_TEXTO[h.acao]||'atualizou'} "${h.texto}"`;
    if(navigator.vibrate) navigator.vibrate([150,80,150]);
    if(window.Notification && Notification.permission === 'granted'){
      try{ new Notification('Tarefas de Casa', {body:msg, icon:'icon.svg'}); }catch(e){}
    }
  }
  function addHistorico(texto, acao){
    historicoRef.push({ texto, usuario: usuarioAtual || 'Alguém', acao, timestamp: Date.now() });
  }

  db.ref('.info/connected').on('value', snap => {
    document.getElementById('statusDot').classList.toggle('on', snap.val() === true);
  });

  categoriasRef.once('value').then(snap=>{ if(!snap.exists()) categoriasRef.set(DEFAULT_CATEGORIAS); });
  categoriasRef.on('value', snap=>{
    CATEGORIAS = snap.val() || DEFAULT_CATEGORIAS;
    renderCategoriaOptions();
    renderFiltros();
    render();
  });

  function renderCategoriaOptions(){
    const sel = document.getElementById('newTaskCategoria');
    const atual = sel.value;
    sel.innerHTML = Object.entries(CATEGORIAS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
    if(CATEGORIAS[atual]) sel.value = atual;
  }

  function askNovaTag(){
    document.getElementById('modalText').textContent = 'Nome da nova tag:';
    document.getElementById('modalInput').style.display = 'block';
    document.getElementById('modalInput').value = '';
    document.getElementById('modalConfirmBtn').textContent = 'Criar';
    document.getElementById('modalConfirmBtn').className = 'btn-save';
    document.getElementById('modalConfirmBtn').onclick = confirmNovaTag;
    document.getElementById('modalBg').classList.add('show');
  }
  function confirmNovaTag(){
    const nome = document.getElementById('modalInput').value.trim();
    if(nome){
      const cor = PALETA[Object.keys(CATEGORIAS).length % PALETA.length];
      categoriasRef.push({label:nome, cor});
    }
    resetModal();
  }

  historicoRef.limitToLast(200).on('value', snap=>{
    const val = snap.val() || {};
    const entries = Object.entries(val).map(([id,v])=>({id, ...v}));
    if(!firstHistoricoLoad){
      entries.forEach(e=>{ if(!historicoIds.has(e.id) && e.usuario !== usuarioAtual) notify(e); });
    }
    historicoIds = new Set(entries.map(e=>e.id));
    historicoCache = entries.sort((a,b)=> b.timestamp - a.timestamp);
    firstHistoricoLoad = false;
    renderHistorico();
    renderScore();
  });

  function renderScore(){
    const seteDias = Date.now() - 7*24*3600*1000;
    const contagem = {};
    historicoCache.forEach(h=>{
      if(h.acao==='concluiu' && h.timestamp>=seteDias) contagem[h.usuario]=(contagem[h.usuario]||0)+1;
    });
    document.getElementById('scoreLabel').textContent =
      `🏆 7 dias: Leandro ${contagem['Leandro']||0} · Esposa ${contagem['Esposa']||0}`;
  }

  function renderHistorico(){
    const wrap = document.getElementById('historicoList');
    wrap.innerHTML = historicoCache.slice(0,30).map(h=>`
      <div class="hist-item">
        <span class="hist-time">${formatHora(h.timestamp)}</span>
        <span class="hist-txt"><span class="hist-user">${escapeHtml(h.usuario||'Alguém')}</span>
        ${ACOES_TEXTO[h.acao]||h.acao} <b>${escapeHtml(h.texto||'')}</b></span>
        <button class="icon-btn" onclick="excluirHistorico('${h.id}')">🗑</button>
      </div>`).join('') || '<div class="empty" style="padding:20px;font-size:16px;">Nada por aqui ainda</div>';
  }
  function excluirHistorico(id){ historicoRef.child(id).remove(); }
  function openHistorico(){ document.getElementById('historicoBg').classList.add('show'); }
  function closeHistorico(){ document.getElementById('historicoBg').classList.remove('show'); }

  function resetRecorrentes(){
    const agora = Date.now();
    Object.entries(tarefas).forEach(([id,t])=>{
      if(t.feita && t.recorrencia && t.recorrencia!=='nenhuma' && t.feitoEm){
        let reset = false;
        if(t.recorrencia==='diaria') reset = new Date(t.feitoEm).toDateString() !== new Date(agora).toDateString();
        else if(t.recorrencia==='semanal') reset = (agora - t.feitoEm) >= 7*24*3600*1000;
        if(reset) tarefasRef.child(id).update({feita:false, feitoPor:null, feitoEm:null});
      }
    });
  }

  tarefasRef.on('value', snap => {
    tarefas = snap.val() || {};
    resetRecorrentes();
    render();
  });
</script><script>
  function setFiltro(cat){ categoriaFiltro = cat; renderFiltros(); render(); }
  function renderFiltros(){
    const chips = document.getElementById('filtroChips');
    const cats = [{key:'todas', label:'Todas', cor:'#7C4DFF'},
      ...Object.entries(CATEGORIAS).map(([k,v])=>({key:k, ...v}))];
    chips.innerHTML = cats.map(c=>
      `<button class="chip ${categoriaFiltro===c.key?'active':''}" style="--chip-cor:${c.cor}" onclick="setFiltro('${c.key}')">${c.label}</button>`
    ).join('');
  }

  function addTask(){
    const input = document.getElementById('newTaskInput');
    const texto = input.value.trim();
    if(!texto) return;
    const categoria = document.getElementById('newTaskCategoria').value;
    const recorrencia = document.getElementById('newTaskRecorrencia').value;
    tarefasRef.push({ texto, feita:false, feitoPor:null, feitoEm:null, comentario:'',
      categoria, recorrencia, ordem: Date.now() });
    addHistorico(texto, 'criou');
    input.value='';
  }
  document.getElementById('newTaskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

  function toggleTask(id){
    const t = tarefas[id];
    if(!usuarioAtual){ showAlert('Escolha quem é você lá em cima antes de marcar.'); return; }
    const feita = !t.feita;
    tarefasRef.child(id).update({ feita, feitoPor: feita?usuarioAtual:null, feitoEm: feita?Date.now():null });
    addHistorico(t.texto, feita ? 'concluiu' : 'reabriu');
  }

  let commentTimers = {};
  function onCommentInput(id, val){
    clearTimeout(commentTimers[id]);
    commentTimers[id] = setTimeout(()=>{
      tarefasRef.child(id).update({ comentario: val });
      if(val.trim()) addHistorico(tarefas[id]?.texto || '', 'comentou');
    }, 600);
  }

  function moveTask(id, dir){
    const t = tarefas[id];
    const grupo = Object.entries(tarefas).filter(([k,v])=>v.feita===t.feita)
      .sort((a,b)=>(a[1].ordem||0)-(b[1].ordem||0));
    const idx = grupo.findIndex(([k])=>k===id);
    const alvo = idx+dir;
    if(alvo<0 || alvo>=grupo.length) return;
    const [idA, tA] = grupo[idx], [idB, tB] = grupo[alvo];
    const updates = {};
    updates[`tarefas/${idA}/ordem`] = tB.ordem||0;
    updates[`tarefas/${idB}/ordem`] = tA.ordem||0;
    db.ref().update(updates);
  }

  let deleteTargetId = null, editTargetId = null;

  function askDelete(id, texto){
    deleteTargetId = id; editTargetId = null;
    document.getElementById('modalText').textContent = `Excluir a tarefa "${texto}"?`;
    document.getElementById('modalInput').style.display = 'none';
    document.getElementById('modalConfirmBtn').textContent = 'Excluir';
    document.getElementById('modalConfirmBtn').className = 'btn-confirm';
    document.getElementById('modalConfirmBtn').onclick = confirmDelete;
    document.getElementById('modalBg').classList.add('show');
  }
  function confirmDelete(){
    if(deleteTargetId){
      const texto = tarefas[deleteTargetId]?.texto || '';
      tarefasRef.child(deleteTargetId).remove();
      addHistorico(texto, 'excluiu');
    }
    resetModal();
  }

  function askEdit(id, textoAtual){
    editTargetId = id; deleteTargetId = null;
    document.getElementById('modalText').textContent = 'Editar tarefa:';
    document.getElementById('modalInput').style.display = 'block';
    document.getElementById('modalInput').value = textoAtual;
    document.getElementById('modalConfirmBtn').textContent = 'Salvar';
    document.getElementById('modalConfirmBtn').className = 'btn-save';
    document.getElementById('modalConfirmBtn').onclick = confirmEdit;
    document.getElementById('modalBg').classList.add('show');
  }
  function confirmEdit(){
    const novo = document.getElementById('modalInput').value.trim();
    if(novo && editTargetId){
      tarefasRef.child(editTargetId).update({ texto: novo });
      addHistorico(novo, 'editou');
    }
    resetModal();
  }

  function showAlert(msg){
    deleteTargetId = null; editTargetId = null;
    document.getElementById('modalText').textContent = msg;
    document.getElementById('modalInput').style.display = 'none';
    document.getElementById('modalConfirmBtn').style.display = 'none';
    document.getElementById('modalBg').classList.add('show');
  }
  function resetModal(){
    document.getElementById('modalBg').classList.remove('show');
    document.getElementById('modalConfirmBtn').style.display = 'inline-block';
    document.getElementById('modalInput').style.display = 'none';
    document.getElementById('modalInput').value = '';
    deleteTargetId = null; editTargetId = null;
  }

  function formatHora(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' +
           d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    let foco = null;
    const ativo = document.activeElement;
    if(ativo && ativo.tagName === 'TEXTAREA' && ativo.dataset.taskid){
      foco = { id: ativo.dataset.taskid, start: ativo.selectionStart, end: ativo.selectionEnd };
    }
    const list = document.getElementById('taskList');
    let ids = Object.keys(tarefas).filter(id=>
      categoriaFiltro==='todas' || tarefas[id].categoria===categoriaFiltro);

    if(ids.length===0){
      list.innerHTML = '<div class="empty">Nenhuma tarefa aqui 🏡<br>adiciona ali em cima</div>';
    } else {
      ids.sort((a,b)=>{
        if(tarefas[a].feita !== tarefas[b].feita) return tarefas[a].feita - tarefas[b].feita;
        return (tarefas[a].ordem||0) - (tarefas[b].ordem||0);
      });
      list.innerHTML = ids.map(id=>{
        const t = tarefas[id];
        const cat = CATEGORIAS[t.categoria] || {label:'Outro', cor:'#888'};
        const meta = t.feita ? `<div class="task-meta">${t.feitoPor} · ${formatHora(t.feitoEm)}</div>` : '';
        const rec = t.recorrencia && t.recorrencia!=='nenhuma'
          ? `<span>🔁 ${t.recorrencia==='diaria'?'Diária':'Semanal'}</span>` : '';
        const textoSeguro = escapeHtml(t.texto).replace(/'/g,"\\'");
        return `
          <div class="task ${t.feita?'done':''}">
            <div class="task-top">
              <div class="check ${t.feita?'checked':''}" onclick="toggleTask('${id}')">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <div class="task-text" onclick="toggleTask('${id}')">${escapeHtml(t.texto)}</div>
              <div class="reorder">
                <button onclick="moveTask('${id}',-1)">▲</button>
                <button onclick="moveTask('${id}',1)">▼</button>
              </div>
              <button class="icon-btn" onclick="askEdit('${id}','${textoSeguro}')">✎</button>
              <button class="icon-btn" onclick="askDelete('${id}','${textoSeguro}')">✕</button>
            </div>
            <div class="badges"><span class="cat-dot" style="background:${cat.cor}"></span>${cat.label} ${rec}</div>
            ${meta}
            <div class="task-row2">
              <select onchange="tarefasRef.child('${id}').update({categoria:this.value})">
                ${Object.entries(CATEGORIAS).map(([k,v])=>
                  `<option value="${k}" ${t.categoria===k?'selected':''}>${v.label}</option>`).join('')}
              </select>
              <select onchange="tarefasRef.child('${id}').update({recorrencia:this.value})">
                <option value="nenhuma" ${(!t.recorrencia||t.recorrencia==='nenhuma')?'selected':''}>Não repete</option>
                <option value="diaria" ${t.recorrencia==='diaria'?'selected':''}>Diária</option>
                <option value="semanal" ${t.recorrencia==='semanal'?'selected':''}>Semanal</option>
              </select>
            </div>
            <div class="comment-box">
              <textarea data-taskid="${id}" placeholder="O que falta..." oninput="onCommentInput('${id}', this.value)">${escapeHtml(t.comentario||'')}</textarea>
            </div>
          </div>`;
      }).join('');
    }
    const total = ids.length, feitas = ids.filter(id=>tarefas[id].feita).length;
    document.getElementById('progressBar').style.width = total? (feitas/total*100)+'%' : '0%';
    document.getElementById('progressLabel').textContent = `${feitas} de ${total} feitas`;
    if(foco && tarefas[foco.id]){
      const el = list.querySelector(`textarea[data-taskid="${foco.id}"]`);
      if(el){ el.focus(); try{ el.setSelectionRange(foco.start, foco.end); }catch(e){} }
    }
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
